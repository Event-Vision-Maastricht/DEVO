### DEVO Config File for VECtor ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 18
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 9
EDGE_THINNING: False
EDGE_THIN_DENSE_WINDOW: 3
EDGE_THIN_STRIDE: 2
CORR_SINGLE_LEVEL: False

# Active-to-frozen edge marginalization
ACTIVE_EDGE_MARGINALIZATION: True
MARGINALIZE_WEIGHT_THRESH: 0.6
MARGINALIZE_DELTA_THRESH: 0.35
MARGINALIZE_MIN_AGE: 3
MARGINALIZE_CORE_WINDOW: 3
MARGINALIZE_WEIGHT_DECAY: 0.99
MARGINALIZE_MAX_ACTIVE_EDGES: 3000
MARGINALIZE_ADAPTIVE_BUDGET: True
MARGINALIZE_MIN_ACTIVE_EDGES: 3000
MARGINALIZE_BASE_ACTIVE_EDGES: 3400
MARGINALIZE_HARD_ACTIVE_EDGES: 4200
MARGINALIZE_ADAPT_INTERVAL: 4
MARGINALIZE_ADAPT_MEDIUM_RATIO: 0.10
MARGINALIZE_ADAPT_HARD_RATIO: 0.20
MARGINALIZE_ADAPT_DELTA_THRESH: 0.75
MARGINALIZE_ADAPT_CONF_THRESH: 0.45
MARGINALIZE_ADAPT_MOTION_THRESH: 0.45
MARGINALIZE_ADAPT_HARD_MOTION_THRESH: 0.8
MARGINALIZE_ADAPT_MAX_STEP: 400
WARM_UPDATE_ENABLED: False
WARM_MIN_NEURAL_EDGES: 1800
WARM_BASE_NEURAL_EDGES: 2100
WARM_HARD_NEURAL_EDGES: 2600
WARM_CORE_BONUS: 2.0
WARM_DELTA_WEIGHT: 2.0
WARM_LOWCONF_WEIGHT: 1.0
WARM_STABLE_CONF_THRESH: 0.6
WARM_STABLE_DELTA_THRESH: 0.35
ADAPTIVE_UPDATE_ENABLED: False
ADAPTIVE_FULL_UPDATE_INTERVAL: 2
ADAPTIVE_UPDATE_CORE_WINDOW: 1
ADAPTIVE_UPDATE_DELTA_THRESH: 0.75
ADAPTIVE_UPDATE_CONF_THRESH: 0.45
ADAPTIVE_UPDATE_MIN_EDGES: 1800
COMPILE_UPDATE_NET: True
COMPILE_UPDATE_MODE: 'reduce-overhead'
COMPILE_UPDATE_DYNAMIC: True
COMPILE_UPDATE_FALLBACK: True
SCALAR_SOFTAGG: False
MARGINALIZE_FORCE_BUDGET: True
MARGINALIZE_USE_FROZEN_IN_BA: True
MARGINALIZE_REFRESH_TARGETS: False
MARGINALIZE_FORCE_DELTA_THRESH: 10.0
MARGINALIZE_FREEZE_DELTA_WEIGHT: 2.0
MARGINALIZE_PROTECT_DELTA_THRESH: 0.0
MARGINALIZE_PROTECT_CONF_THRESH: 0.0
MARGINALIZE_COVERAGE_STRIDE: 0
MARGINALIZE_COVERAGE_PENALTY: 0.0
MARGINALIZE_AGE_WEIGHT: 0.0
MARGINALIZE_BACKBONE_WINDOW: 0
MARGINALIZE_BACKBONE_PENALTY: 0.0
MARGINALIZE_VALIDATE_FROZEN: True
MARGINALIZE_VALIDATE_INTERVAL: 3
MARGINALIZE_SOFT_FROZEN_RESIDUAL: 2.0
MARGINALIZE_MAX_FROZEN_RESIDUAL: 8.0
MARGINALIZE_MIN_FROZEN_WEIGHT_SCALE: 0.2
MARGINALIZE_FROZEN_BA_WEIGHT: 1.0
MARGINALIZE_REACTIVATE_FROZEN: False
MARGINALIZE_REACTIVATE_RESIDUAL: 4.0
MARGINALIZE_MAX_REACTIVATE: 128
MARGINALIZE_REACTIVATE_KEEPALIVE: 2
MARGINALIZE_MAX_FROZEN_EDGES: 6000
MARGINALIZE_PRUNE_INTERVAL: 6
MARGINALIZE_PRINT_STATS: False
BA_ITERATIONS: 6
FINAL_BA_ENABLED: False
FINAL_BA_WINDOW: 0
FINAL_BA_ROUNDS: 2
FINAL_BA_ITERATIONS: 12
TRAJECTORY_SMOOTHING: False
TRAJECTORY_SMOOTHING_ALPHA: 0.15
TRAJECTORY_SMOOTHING_PASSES: 1

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

# Select between random, gradient, scorer
PATCH_SELECTOR: 'scorer'
# Normalizer (only evs): none, rescale, standard (std)
NORM: 'std'
# Eval mode of patch selector (random, topk, multinomial)
SCORER_EVAL_MODE: 'topk'
SCORER_EVAL_USE_GRID: True
