### DEVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 80
REMOVAL_WINDOW: 26
OPTIMIZATION_WINDOW: 16
PATCH_LIFETIME: 8
EDGE_THINNING: False
EDGE_THIN_DENSE_WINDOW: 3
EDGE_THIN_STRIDE: 2

# Active-to-frozen edge marginalization
ACTIVE_EDGE_MARGINALIZATION: True
MARGINALIZE_WEIGHT_THRESH: 0.75
MARGINALIZE_DELTA_THRESH: 0.25
MARGINALIZE_MIN_AGE: 3
MARGINALIZE_CORE_WINDOW: 4
MARGINALIZE_MAX_ACTIVE_EDGES: 1800
MARGINALIZE_ADAPTIVE_BUDGET: False
MARGINALIZE_MIN_ACTIVE_EDGES: 1800
MARGINALIZE_BASE_ACTIVE_EDGES: 1800
MARGINALIZE_HARD_ACTIVE_EDGES: 1800
MARGINALIZE_ADAPT_INTERVAL: 4
MARGINALIZE_ADAPT_MEDIUM_RATIO: 0.12
MARGINALIZE_ADAPT_HARD_RATIO: 0.25
MARGINALIZE_ADAPT_DELTA_THRESH: 0.75
MARGINALIZE_ADAPT_CONF_THRESH: 0.45
WARM_UPDATE_ENABLED: False
WARM_MIN_NEURAL_EDGES: 1800
WARM_BASE_NEURAL_EDGES: 2100
WARM_HARD_NEURAL_EDGES: 2600
WARM_CORE_BONUS: 2.0
WARM_DELTA_WEIGHT: 2.0
WARM_LOWCONF_WEIGHT: 1.0
WARM_STABLE_CONF_THRESH: 0.6
WARM_STABLE_DELTA_THRESH: 0.35
MARGINALIZE_WEIGHT_DECAY: 0.98
MARGINALIZE_FORCE_BUDGET: True
MARGINALIZE_FORCE_DELTA_THRESH: 10.0
MARGINALIZE_FREEZE_DELTA_WEIGHT: 2.0
MARGINALIZE_PROTECT_DELTA_THRESH: 0.75
MARGINALIZE_PROTECT_CONF_THRESH: 0.45
MARGINALIZE_COVERAGE_STRIDE: 4
MARGINALIZE_COVERAGE_PENALTY: 0.75
MARGINALIZE_AGE_WEIGHT: 0.02
MARGINALIZE_VALIDATE_FROZEN: True
MARGINALIZE_VALIDATE_INTERVAL: 3
MARGINALIZE_SOFT_FROZEN_RESIDUAL: 1.5
MARGINALIZE_MAX_FROZEN_RESIDUAL: 6.0
MARGINALIZE_MIN_FROZEN_WEIGHT_SCALE: 0.2
MARGINALIZE_REACTIVATE_FROZEN: True
MARGINALIZE_REACTIVATE_RESIDUAL: 2.5
MARGINALIZE_MAX_REACTIVATE: 192
MARGINALIZE_REACTIVATE_KEEPALIVE: 3
MARGINALIZE_MAX_FROZEN_EDGES: 12000
MARGINALIZE_PRUNE_INTERVAL: 8
MARGINALIZE_PRINT_STATS: False
BA_ITERATIONS: 10

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

# Select between random, gradient, scorer
PATCH_SELECTOR: 'scorer'
# Normalizer (only evs): none, rescale, standard (std)
NORM: 'std'
# Eval mode of patch selector (random, topk, multinomial)
SCORER_EVAL_MODE: 'multi'
SCORER_EVAL_USE_GRID: True
