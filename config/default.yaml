### DEVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 22
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 13

# Active-to-frozen edge marginalization
ACTIVE_EDGE_MARGINALIZATION: True
MARGINALIZE_WEIGHT_THRESH: 0.75
MARGINALIZE_DELTA_THRESH: 0.25
MARGINALIZE_MIN_AGE: 3
MARGINALIZE_CORE_WINDOW: 4
MARGINALIZE_MAX_ACTIVE_EDGES: 3000
MARGINALIZE_WEIGHT_DECAY: 0.99
MARGINALIZE_FORCE_BUDGET: True
MARGINALIZE_FORCE_DELTA_THRESH: 1.0
MARGINALIZE_VALIDATE_FROZEN: True
MARGINALIZE_VALIDATE_INTERVAL: 3
MARGINALIZE_SOFT_FROZEN_RESIDUAL: 2.0
MARGINALIZE_MAX_FROZEN_RESIDUAL: 8.0
MARGINALIZE_MIN_FROZEN_WEIGHT_SCALE: 0.2
MARGINALIZE_MAX_FROZEN_EDGES: 6000
MARGINALIZE_PRINT_STATS: False
BA_ITERATIONS: 6

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True

# Select between random, gradient, scorer
PATCH_SELECTOR: 'scorer'
# Normalizer (only evs): none, rescale, standard (std)
NORM: 'std'
# Eval mode of patch selector (random, topk, multinomial)
SCORER_EVAL_MODE: 'multi'
SCORER_EVAL_USE_GRID: True
